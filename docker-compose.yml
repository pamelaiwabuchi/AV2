services:
  banco:
    image: postgres:18
    environment:
      POSTGRES_USER: greencode
      POSTGRES_PASSWORD: greencode
      POSTGRES_DB: greencode
    volumes:
      - dados-banco:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencode -d greencode"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://greencode:greencode@banco:5432/greencode
      PORT: 3333
      JWT_SECRET: ${JWT_SECRET:-troque-por-um-texto-aleatorio-e-longo}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_SENHA: ${ADMIN_SENHA:-Greencode1}
      EMPRESA_RAZAO_SOCIAL: ${EMPRESA_RAZAO_SOCIAL:-GreenCode Logística Reversa Ltda}
      EMPRESA_CNPJ: ${EMPRESA_CNPJ:-47.638.125/0001-05}
    ports:
      - "3333:3333"
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados-banco:
